- name: Set Hosts to Ip Mapping in /etc/hosts file of all servers
  hosts: all
  tasks:
    - name: Import vpc setup variables
      include_vars:
        file: group_vars/hostsip
    
    - name: update hosts file for all the hosts
      blockinfile:
        path: /etc/hosts
        block: |
         {{web01_ip}} web01
         {{app01_ip}} app01
         {{rmq01_ip}} rmq01
         {{mem01_ip}} mc01
         {{db01_ip}} db01

         